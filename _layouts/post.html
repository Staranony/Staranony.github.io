---
layout: default
---
<article>
  <a class="path" href="{{ '/blog/' | relative_url }}">&gt; valuechaindata.com/blog</a>
  <h1>{{ page.title }}</h1>
  <p class="role"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  <div class="post-body">
    {{ content }}
  </div>
  <nav class="pager">
    {% if page.previous %}<a class="btn" href="{{ page.previous.url | relative_url }}" title="{{ page.previous.title | escape }}">← Prev</a>{% endif %}
    <a class="btn primary" href="{{ '/blog/' | relative_url }}">All posts</a>
    {% if page.next %}<a class="btn" href="{{ page.next.url | relative_url }}" title="{{ page.next.title | escape }}">Next →</a>{% endif %}
  </nav>
</article>
